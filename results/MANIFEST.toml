# Provenance manifest for results/: every committed result file, its SHA-256,
# the platform and system it measures, and its role. Loaders read this instead
# of globbing results/, and fail when a (platform, system) has more or fewer
# than one "official" file, when a file's SHA-256 differs, or when a file under
# results/ is not listed. Adding this file changes no result file.
#
# role: official      the run a published table uses
#       superseded    an earlier official-platform run no table uses
#       sandbox       reduced-count indicative run (sandbox=true), never cited
#       repetition    one of the five variability repetitions (rep = 1..5)
#       gate-evidence ALLOW/DENY verdicts written by the correctness gate
#
# Check: python3 python/results_manifest.py check

schema = "pct-eval/results-manifest@1"

[platforms.apple-m4]
cpu = "Apple M4 (4P+6E)"
row_label = "Apple M4 (reference)"
caption = "Apple M4 Mac mini, macOS/aarch64"
delay_method = "toxiproxy"
delay_method_evidence = "commit 2b424a2 message; tight p95/p50 tail at +5/+20 ms (ERRATA-DRAFT.md, B)"

[platforms.x86-cloud]
cpu = "Intel Xeon @ 2.10GHz (4 vCPU)"
row_label = "x86-64 container"
caption = "Intel Xeon at 2.10\\,GHz, four vCPUs, Linux/x86-64, inside a container under a hypervisor"
delay_method = "toxiproxy"
delay_method_evidence = "scripts/run-cloud-x86.sh sets PCT_DELAY_METHOD=toxiproxy"

[platforms.sandbox-aarch64]
cpu = "aarch64-sandbox(4vcpu)"
row_label = "aarch64 sandbox (indicative)"
caption = "Linux/aarch64 sandbox, reduced counts (indicative only)"
delay_method = "asyncio"
delay_method_evidence = "README: sandbox rows used the in-repo asyncio delay proxy"

